services:
  - type: web
    name: alkos-management
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: alkos
      - key: MASTER_ADMIN_EMAIL
        value: alkos@geita.tz
      - key: CRON_SECRET
        sync: false
